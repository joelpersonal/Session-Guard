<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <rect width="800" height="450" fill="#0f172a" rx="10"/>
  <text x="400" y="32" fill="#38bdf8" font-size="18" font-weight="bold" text-anchor="middle" font-family="sans-serif">
    Figure 5: Detection Rate (Recall) vs. False Positive Rate Across Methods
  </text>
  
  <!-- Plot area boundary -->
  <rect x="80" y="50" width="640" height="340" fill="#1e293b" stroke="#334155"/>

  <!-- Ideal Target Quadrant (Top Left: High Recall, Low FPR) -->
  <rect x="80" y="50" width="96" height="51" fill="rgba(16, 185, 129, 0.15)" stroke="#10b981" stroke-dasharray="4"/>
  <text x="88" y="70" fill="#10b981" font-size="11" font-family="sans-serif">Optimal Zone</text>

  <!-- Grid lines -->
  <line x1="240" y1="50" x2="240" y2="390" stroke="#334155" stroke-dasharray="3"/>
  <line x1="400" y1="50" x2="400" y2="390" stroke="#334155" stroke-dasharray="3"/>
  <line x1="560" y1="50" x2="560" y2="390" stroke="#334155" stroke-dasharray="3"/>

  <line x1="80" y1="305" x2="720" y2="305" stroke="#334155" stroke-dasharray="3"/>
  <line x1="80" y1="220" x2="720" y2="220" stroke="#334155" stroke-dasharray="3"/>
  <line x1="80" y1="135" x2="720" y2="135" stroke="#334155" stroke-dasharray="3"/>

  <!-- Axis ticks & labels -->
  <text x="80" y="410" fill="#94a3b8" font-size="12" text-anchor="middle" font-family="sans-serif">0.0</text>
  <text x="240" y="410" fill="#94a3b8" font-size="12" text-anchor="middle" font-family="sans-serif">0.25</text>
  <text x="400" y="410" fill="#94a3b8" font-size="12" text-anchor="middle" font-family="sans-serif">0.50</text>
  <text x="560" y="410" fill="#94a3b8" font-size="12" text-anchor="middle" font-family="sans-serif">0.75</text>
  <text x="720" y="410" fill="#94a3b8" font-size="12" text-anchor="middle" font-family="sans-serif">1.0</text>
  <text x="400" y="435" fill="#94a3b8" font-size="13" text-anchor="middle" font-family="sans-serif">False Positive Rate (FPR)</text>

  <text x="68" y="390" fill="#94a3b8" font-size="12" text-anchor="end" font-family="sans-serif">0%</text>
  <text x="68" y="220" fill="#94a3b8" font-size="12" text-anchor="end" font-family="sans-serif">50%</text>
  <text x="68" y="50" fill="#94a3b8" font-size="12" text-anchor="end" font-family="sans-serif">100%</text>
  <text x="24" y="220" fill="#94a3b8" font-size="13" transform="rotate(-90 24 220)" text-anchor="middle" font-family="sans-serif">Detection Rate (Recall)</text>

  <!-- Method Scatter Points & Callouts -->
  
    <circle cx="80" cy="390" r="9" fill="#64748b" stroke="#ffffff" stroke-width="2"/>
    <text x="94" y="394" fill="#64748b" font-size="13" font-weight="bold" font-family="sans-serif">
      Token-Only (0% Det, 0% FPR)
    </text>
  
    <circle cx="240" cy="135" r="9" fill="#ef4444" stroke="#ffffff" stroke-width="2"/>
    <text x="254" y="139" fill="#ef4444" font-size="13" font-weight="bold" font-family="sans-serif">
      Network Binding (75% Det, 25% FPR)
    </text>
  
    <circle cx="240" cy="135" r="9" fill="#f59e0b" stroke="#ffffff" stroke-width="2"/>
    <text x="254" y="139" fill="#f59e0b" font-size="13" font-weight="bold" font-family="sans-serif">
      Network + UA (75% Det, 25% FPR)
    </text>
  
    <circle cx="80" cy="50" r="9" fill="#10b981" stroke="#ffffff" stroke-width="2"/>
    <text x="94" y="54" fill="#10b981" font-size="13" font-weight="bold" font-family="sans-serif">
      SessionGuard (100% Det, 0% FPR)
    </text>
  
</svg>